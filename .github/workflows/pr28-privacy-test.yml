name: PR 28 HTTP privacy regression tests

on:
  push:
    branches:
      - fix/issue-25-http-warning
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr28-privacy-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.4.1'
          validate-wrappers: false

      - name: Run unit tests and compile modules
        run: gradle --no-daemon --stacktrace :library:testDebugUnitTest :library:assembleDebug :xtcrash-compose:assembleDebug
