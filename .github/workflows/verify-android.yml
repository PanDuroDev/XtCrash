name: Verify Android library

on:
  push:
    branches:
      - integration/xtmapper-compatibility-audit
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          # API 37 is published as android-37.0 in the SDK repository.
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          # AGP looks up compileSdk 37 as android-37; provide the compatibility alias.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up pinned Gradle distribution
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      # The repository wrapper JAR currently has a hash not yet recognized by
      # Gradle's wrapper validator. CI uses the pinned official distribution
      # directly rather than disabling wrapper validation or executing that JAR.
      - name: Run unit tests and compile modules
        run: |
          gradle --no-daemon \
            :library:testDebugUnitTest \
            :library:compileDebugKotlin \
            :xtcrash-compose:compileDebugKotlin

      - name: Run lint and assemble consumer artifacts
        run: |
          gradle --no-daemon \
            :library:lintDebug \
            :library:assembleDebug \
            :xtcrash-compose:assembleDebug \
            :xtcrash-sample:assembleDebug
