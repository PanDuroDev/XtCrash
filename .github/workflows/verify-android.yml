name: Verify Android library

on:
  push:
    branches:
      - integration/xtmapper-compatibility-audit
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  unit-tests:
    name: Isolated unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up pinned Gradle distribution
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
          validate-wrappers: false

      # Force a clean execution of the test task; no test reports or test files are uploaded.
      - name: Run unit tests without build cache
        run: |
          gradle --no-daemon --no-build-cache --rerun-tasks --stacktrace \
            :library:testDebugUnitTest

  lint:
    name: Isolated lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up pinned Gradle distribution
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
          validate-wrappers: false

      - name: Run lint without build cache
        run: |
          gradle --no-daemon --no-build-cache --rerun-tasks --stacktrace \
            :library:lintDebug

  consumer-assembly:
    name: Isolated consumer assembly
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up pinned Gradle distribution
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
          validate-wrappers: false

      - name: Assemble consumer modules without build cache
        run: |
          gradle --no-daemon --no-build-cache --rerun-tasks --stacktrace \
            :library:compileDebugKotlin \
            :xtcrash-compose:compileDebugKotlin \
            :library:assembleDebug \
            :xtcrash-compose:assembleDebug \
            :xtcrash-sample:assembleDebug

  release-packaging:
    name: Isolated release packaging
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up pinned Gradle distribution
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
          validate-wrappers: false

      # Enable R8 for the core library and sample app only for this verification run.
      # The Compose library remains unminified; its consuming app performs shrinking.
      # No binaries, test files, or test reports are uploaded.
      - name: Assemble R8-enabled core and sample release without build cache
        run: |
          gradle --no-daemon --no-build-cache --rerun-tasks --stacktrace -PverifyR8=true \
            :library:assembleRelease \
            :xtcrash-compose:assembleRelease \
            :xtcrash-sample:assembleRelease
