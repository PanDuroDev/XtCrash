name: PR 27 privacy preview validation

on:
  push:
    branches:
      - fix/issue-24-privacy-confirmation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run unit tests and compile Android modules
        run: ./gradlew --no-daemon --stacktrace :library:testDebugUnitTest :library:assembleDebug :xtcrash-compose:assembleDebug
