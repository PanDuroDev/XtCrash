name: Build and deploy docs

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate core API reference
        run: ./gradlew --no-daemon :library:dokkaGeneratePublicationHtml

      - name: Generate Compose API reference
        run: ./gradlew --no-daemon :xtcrash-compose:dokkaGeneratePublicationHtml

      - name: Verify generated API output
        run: |
          test -f docs/public/api/core/index.html
          test -f docs/public/api/compose/index.html

      - name: Check internal documentation links
        run: node docs/scripts/check-links.mjs

      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
