name: Deploy docs to GitHub Pages

on:
  # Deploy whenever documentation changes reach the default branch.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  # Repository read only; the Pages scopes live on the deploy job alone.
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          path: docs

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
