import org.jetbrains.dokka.gradle.engine.parameters.VisibilityModifier
import java.net.URI

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'org.jetbrains.dokka'
group = 'com.github.SoufianoDev'

ext {
    PUBLISH_GROUP_ID = 'com.github.SoufianoDev'
    PUBLISH_VERSION = '1.0.0'
    PUBLISH_ARTIFACT_ID = 'xtcrash'
    PUBLISH_DESCRIPTION = 'Modern crash recovery error screen for Android.'
    PUBLISH_URL = 'https://github.com/SoufianoDev/XtCrash'
    PUBLISH_LICENSE_NAME = 'Apache License'
    PUBLISH_LICENSE_URL =
            'https://github.com/SoufianoDev/XtCrash/blob/master/LICENSE'
    PUBLISH_DEVELOPER_ID = 'soufianodev'
    PUBLISH_DEVELOPER_NAME = 'SoufianoDev'
    PUBLISH_DEVELOPER_EMAIL = 'contact@crashx.dev'
    PUBLISH_SCM_CONNECTION =
            'scm:git:github.com/SoufianoDev/XtCrash.git'
    PUBLISH_SCM_DEVELOPER_CONNECTION =
            'scm:git:ssh://github.com/SoufianoDev/XtCrash.git'
    PUBLISH_SCM_URL =
            'https://github.com/SoufianoDev/XtCrash/tree/master'
}

android {
    namespace 'io.github.soufianodev.xtcrash'
    compileSdk 37
    resourcePrefix 'crash_'

    defaultConfig {
        minSdk 23
        targetSdk 37
        versionCode 11
        versionName "1.0.0"
    }
    buildTypes {
        release {
            minifyEnabled project.hasProperty('verifyR8')
            consumerProguardFiles 'consumer-rules.pro'
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        abortOnError false
    }
}

dependencies {
	implementation fileTree(include: ['*.jar'], dir: 'libs')

    //ANDROIDX JETPACK LIBRARIES
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    testImplementation 'junit:junit:4.13.2'
}

apply from: "${rootProject.projectDir}/scripts/publish-module.gradle"


dokka {
    dokkaPublications {
        html {
            moduleName.set('XtCrash Core')
            moduleVersion.set(android.defaultConfig.versionName)
            outputDirectory.set(file("${rootProject.projectDir}/docs/public/api/core"))
            failOnWarning.set(false)
        }
    }
    dokkaSourceSets {
        // With AGP's built-in Kotlin support, Dokka can expose a generic JVM
        // source set alongside the Android release source set for the same files.
        configureEach {
            if (name == 'jvm') {
                suppress.set(true)
            } else if (name == 'release') {
                classpath.from(configurations.matching { it.name == 'releaseCompileClasspath' })
                documentedVisibilities.set([VisibilityModifier.Public] as Set)
                perPackageOption {
                    matchingRegex.set('.*\\.internal(\\..*)?')
                    suppress.set(true)
                }
                sourceLink {
                    localDirectory.set(file('src/main/java'))
                    remoteUrl.set(new URI('https://github.com/SoufianoDev/XtCrash/blob/master/library/src/main/java'))
                    remoteLineSuffix.set('#L')
                }
            }
        }
    }
}
