<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="XtCrash — modern crash recovery for Android">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1526"/>
      <stop offset="1" stop-color="#131B2E"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>

  <!-- app mark: red tile with a bold white X -->
  <rect x="96" y="104" width="192" height="192" rx="46" fill="url(#red)"/>
  <path d="M136 148 248 252 M248 148 136 252" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" fill="none"/>

  <!-- wordmark -->
  <text x="340" y="212" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="118" font-weight="800" letter-spacing="1" fill="#FFFFFF"><tspan fill="#8B5CF6">Xt</tspan><tspan fill="#FFFFFF">Crash</tspan></text>

  <!-- tagline + rule -->
  <text x="342" y="266" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" letter-spacing="1.2" fill="#94A3B8">Modern crash recovery for Android</text>
  <rect x="340" y="290" width="560" height="4" rx="2" fill="#1E293B"/>
  <rect x="340" y="288" width="110" height="8" rx="4" fill="#8B5CF6"/>

  <!-- crash screen cameo -->
  <rect x="948" y="112" width="252" height="168" rx="20" fill="#F8FAFC"/>
  <text x="972" y="156" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A">App crashed</text>
  <text x="972" y="184" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#64748B">Something went wrong</text>
  <rect x="972" y="204" width="104" height="44" rx="12" fill="#7C3AED"/>
  <text x="1024" y="233" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Restart</text>
  <rect x="1088" y="204" width="92" height="44" rx="12" fill="#E2E8F0"/>
  <text x="1134" y="233" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#0F172A" text-anchor="middle">Close</text>
</svg>
