import org.jetbrains.dokka.gradle.engine.parameters.VisibilityModifier
import java.net.URI

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'maven-publish'
apply plugin: 'org.jetbrains.dokka'
group = 'com.github.SoufianoDev'

ext {
    PUBLISH_GROUP_ID = 'com.github.SoufianoDev'
    PUBLISH_VERSION = '1.0.0'
    PUBLISH_ARTIFACT_ID = 'xtcrash-compose'
    PUBLISH_DESCRIPTION = 'Jetpack Compose crash screen for XtCrash.'
    PUBLISH_URL = 'https://github.com/SoufianoDev/XtCrash'
    PUBLISH_LICENSE_NAME = 'Apache License'
    PUBLISH_LICENSE_URL = 'https://github.com/SoufianoDev/XtCrash/blob/master/LICENSE'
    PUBLISH_DEVELOPER_ID = 'soufianodev'
    PUBLISH_DEVELOPER_NAME = 'SoufianoDev'
    PUBLISH_DEVELOPER_EMAIL = 'contact@crashx.dev'
    PUBLISH_SCM_CONNECTION = 'scm:git:github.com/SoufianoDev/XtCrash.git'
    PUBLISH_SCM_DEVELOPER_CONNECTION = 'scm:git:ssh://github.com/SoufianoDev/XtCrash.git'
    PUBLISH_SCM_URL = 'https://github.com/SoufianoDev/XtCrash/tree/master'
}

android {
    namespace 'io.github.soufianodev.xtcrash.compose'
    compileSdk 37

    defaultConfig {
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    buildFeatures {
        compose = true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        abortOnError false
    }
}

dependencies {
    api project(':library')

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.material3:material3'
    // shortcut: activity-compose is not mapped by this compose BOM, pinned to its aligned
    // version; drop the pin when the BOM resolves it.
    implementation 'androidx.activity:activity-compose:1.9.2'
}

apply from: "${rootProject.projectDir}/scripts/publish-module.gradle"


dokka {
    dokkaPublications {
        html {
            moduleName.set('XtCrash Compose')
            moduleVersion.set(android.defaultConfig.versionName)
            outputDirectory.set(file("${rootProject.projectDir}/docs/public/api/compose"))
            failOnWarning.set(false)
        }
    }
    dokkaSourceSets {
        // With AGP's built-in Kotlin support, Dokka can expose a generic JVM
        // source set alongside the Android release source set for the same files.
        configureEach {
            if (name == 'jvm') {
                suppress.set(true)
            } else if (name == 'release') {
                documentedVisibilities.set([VisibilityModifier.Public] as Set)
                perPackageOption {
                    matchingRegex.set('.*\\.internal(\\..*)?')
                    suppress.set(true)
                }
                sourceLink {
                    localDirectory.set(file('src/main/java'))
                    remoteUrl.set(new URI('https://github.com/SoufianoDev/XtCrash/blob/master/xtcrash-compose/src/main/java'))
                    remoteLineSuffix.set('#L')
                }
            }
        }
    }
}
